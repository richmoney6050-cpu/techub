name: Build Android APK

# Runs when you change the mobile app, or manually: GitHub -> Actions -> "Build Android APK" -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Quick check that the app's JavaScript bundles
        run: npx expo export --platform android --output-dir /tmp/bundle-check
        env:
          CI: '1'
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Give Gradle enough memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: techhub-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
